server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: zeka-stack-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.5:3306/zeka-stack-helper?useUnicode=true&characterEncoding=utf8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2b8
    username: root
    password: rootpassword

logging:
  level:
    root: INFO
    dev.dong4j.zeka.stack.api: DEBUG

zhipu:
  api:
    base-url: https://open.bigmodel.cn/api/paas/v4
    models-url: ${zhipu.api.base-url}/models
  # 默认模型列表（当 API 获取失败时使用）
  default-models:
    - glm-4.7
    - glm-4.6
    - glm-4.5
    - glm-4.5-air
    - glm-4.5-x
    - glm-4.5-airx
    - glm-4.5-flash
    - glm-4-plus
    - glm-4-air-250414
    - glm-4-airx
    - glm-4-flashx
    - glm-4-flashx-250414

github:
  token: ${ZEKA_STACK_PLUGIN_GITHUB_TOKEN:}
  repository-id: ${GITHUB_REPOSITORY_ID:R_kgDOO3uf9g}
  category:
    general: ${GITHUB_CATEGORY_ID_GENERAL:DIC_kwDOO3uf9s4C0Jcg}
    ideas: ${GITHUB_CATEGORY_ID_IDEAS:DIC_kwDOO3uf9s4C0Jci}
    qa: ${GITHUB_CATEGORY_ID_QA:DIC_kwDOO3uf9s4C0Jch}
    announcements: ${GITHUB_CATEGORY_ID_ANNOUNCEMENTS:DIC_kwDOO3uf9s4C0Jcf}

feedback:
  signature:
    # 是否启用签名验证（生产环境必须启用）
    enabled: ${FEEDBACK_SIGNATURE_ENABLED:true}
    # 客户端 ID 和 Secret 的映射
    # 每个插件使用不同的 Secret，与客户端代码中的 Secret 对应
    clients:
      # IntelliAI Javadoc 插件
      dev.dong4j.zeka.stack.idea.plugin: zeka-stack-javadoc-plugin
      # IntelliAI Nacos 插件
      dev.dong4j.zeka.stack.idea.plugin.nacos: zeka-stack-nacos-plugin
      # IntelliAI Tracer 插件
      dev.dong4j.zeka.stack.idea.plugin.workflow: zeka-stack-tracer-plugin
      # IntelliAI Changelog 插件
      dev.dong4j.zeka.stack.idea.plugin.changelog: zeka-stack-changelog-plugin
      # IntelliAI Engine 插件
      dev.dong4j.zeka.stack.idea.plugin.common.ai: zeka-stack-engine-plugin



