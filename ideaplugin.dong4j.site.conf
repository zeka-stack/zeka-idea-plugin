server {
    listen 80;
    server_name ideaplugin.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ideaplugin.dong4j.site;

    ssl_certificate /etc/nginx/encrypt/site/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/site/privkey.pem;

    ############################################
    # 1. 通用 ZIP 文件下载
    # 示例: /engine/intelli-ai-engine.zip
    #       /javadoc/intelli-ai-javadoc.zip
    ############################################
    location ~ ^/(?<plugin>[^/]+)/(?<zip>[^/]+\.zip)$ {
        alias /var/www/zeka-idea-plugin/intelli-ai-$plugin/$zip;
        types { application/zip zip; }
        add_header Content-Disposition "attachment; filename=\"$zip\"";
    }

    ############################################
    # 2. landing.html
    # 示例: /engine/landing.html
    ############################################
    location ~ ^/(?<plugin>[^/]+)/landing\.html$ {
        alias /var/www/zeka-idea-plugin/intelli-ai-$plugin/site/landing.html;
    }

    ############################################
    # 3. docs.html
    # 示例: /engine/docs.html
    ############################################
    location ~ ^/(?<plugin>[^/]+)/docs\.html$ {
        alias /var/www/zeka-idea-plugin/intelli-ai-$plugin/site/docs.html;
    }

    ############################################
    # 4. 文档静态资源目录（docs/）
    # 示例: /engine/docs/*.md /docs-list.json
    ############################################
    location ~ ^/(?<plugin>[^/]+)/docs/(.*)$ {
        root /var/www/zeka-idea-plugin/intelli-ai-$plugin/site;
        try_files /docs/$2 =404;
    }

    ############################################
    # 5. imgs 图片目录（docs/imgs/）
    ############################################
    location ~ ^/(?<plugin>[^/]+)/imgs/(.*)$ {
        root /var/www/zeka-idea-plugin/intelli-ai-$plugin/site/docs;
        try_files /imgs/$2 =404;
    }

    ############################################
    # 6. 静态图标（logo.svg / favicon.svg）
    ############################################
    location ~ ^/(?<plugin>[^/]+)/(logo|favicon)\.svg$ {
        alias /var/www/zeka-idea-plugin/intelli-ai-$plugin/site/$2.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    ############################################
    # 7. landing.html 引用的图片资源（site/ 根目录）
    # 示例: /engine/intelli-ai-engine.webp
    ############################################
    location ~ ^/(?<plugin>[^/]+)/(?<img>[^/]+\\.(?:webp|png|jpe?g|gif|svg))$ {
        alias /var/www/zeka-idea-plugin/intelli-ai-$plugin/site/$img;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    ############################################
    # 8. buy-me-a-coffee.html 打赏页面
    # 路径: /buy-me-a-coffee
    ############################################
    location = /buy-me-a-coffee {
        alias /var/www/zeka-idea-plugin/buy-me-a-coffee.html;
        default_type text/html;
    }

    location = /buy-me-a-coffee.html {
        alias /var/www/zeka-idea-plugin/buy-me-a-coffee.html;
        default_type text/html;
    }

    location = /version {
        add_header Content-Type text/plain;
        return 200 "2025.3.12";
    }

    location = /whatsnew {
        alias /var/www/zeka-idea-plugin/latest.html;
        default_type text/html;
    }

    location = /whatsnew.html {
        alias /var/www/zeka-idea-plugin/latest.html;
        default_type text/html;
    }

    ############################################
    # 根路径重定向到 engine landing.html（保持你原有行为）
    ############################################
    location = / {
        return 301 /engine/landing.html;
    }
}
