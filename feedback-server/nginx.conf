upstream idea-plugin-feedback-server {
    server 2.0.0.5:8080;
    keepalive 128;
    keepalive_timeout 75;
}

server {
    # 监听 HTTP 并重定向到 HTTPS
    listen 80;
    server_name api.xxx.site;
    return 301 https://$host$request_uri;
}

server {
    # 监听 HTTPS
    listen 443 ssl http2;
    server_name api.xxx.site;
    # SSL 配置
    ssl_certificate /etc/nginx/encrypt/site/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/site/privkey.pem;

    # 日志配置
    access_log /var/log/nginx/api.xxx.site_access.log;
    error_log /var/log/nginx/api.xxx.site_error.log;

    location = /idea-plugin-feedback {
        proxy_pass http://idea-plugin-feedback-server/api/feedback;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
