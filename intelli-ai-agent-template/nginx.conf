server {
    listen 80;
    server_name agent.xxx.site;

    # 全量重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agent.xxx.site;

    # SSL 证书配置（你提供的路径）
    ssl_certificate /etc/nginx/encrypt/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/privkey.pem;

    # TLS 安全配置（推荐）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 文件根目录（可修改）
    root /var/www/data;
    index index.html;

    # 开启目录浏览
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    charset utf-8;

    # 允许大文件下载
    client_max_body_size 0;

    # --------------------
    # 安  全  加  固
    # --------------------

    # 禁止访问隐藏文件，如 .git / .env
    location ~ /\. {
        return 404;
    }

    # 禁止脚本执行
    location ~ \.(php|pl|py|jsp|asp|sh|bash)$ {
        return 403;
    }

    # 防 MIME 嗅探
    add_header X-Content-Type-Options nosniff;

    # 防 iframe 嵌套
    add_header X-Frame-Options DENY;

    # 简易 XSS 防护
    add_header X-XSS-Protection "1; mode=block";

    # IntelliAI Agent 版本接口
    location /version {
        add_header Content-Type text/plain;
        # 新版本需要修改这里的名称
        return 200 "intelli-ai-agent-1.0.0.jar";
    }

    # 静态文件缓存
    location ~* \.(zip|tar|gz)$ {
        expires 30d;
        access_log off;
    }

    # 默认
    location / {
        try_files $uri $uri/ =404;
    }
}
