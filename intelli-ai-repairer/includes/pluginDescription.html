<p><b>IntelliAI Repairer</b> 是一个面向 Checkstyle/PMD 违规的 AI 修复插件，依赖
    <a href="https://plugins.jetbrains.com/plugin/29152">IntelliAI Engine</a> 提供统一的 AI 能力入口。</p>
<p><b>当前能力</b></p>
<ul>
    <li>基于 Checkstyle-IDEA 扫描结果提供 AI QuickFix</li>
    <li>采用“片段替换”策略，确保修复范围可控</li>
</ul>
<p><b>规划</b></p>
<ul>
    <li>解析 Maven 插件生成的 Checkstyle/PMD XML</li>
    <li>Problem 面板批量修复</li>
</ul>
<p><b>依赖</b></p>
<ul>
    <li><a href="https://plugins.jetbrains.com/plugin/29152">IntelliAI Engine</a> 插件</li>
    <li>CheckStyle-IDEA 插件（可选依赖）</li>
</ul>
