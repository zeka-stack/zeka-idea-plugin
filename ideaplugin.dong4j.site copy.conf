server {
    listen 80;
    server_name ideaplugin.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ideaplugin.dong4j.site;

    ssl_certificate /etc/nginx/encrypt/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/privkey.pem;

    ############################################
    # IntelliAI 插件套件统一代理配置
    # 此配置文件管理所有插件的访问路径
    ############################################

    ############################################
    # Engine 插件配置 (intelli-ai-engine)
    # 访问路径: /engine/
    ############################################

    # Engine 插件 ZIP 文件下载（需要优先匹配，避免被 /engine/ 拦截）
    location = /engine/intelli-ai-engine.zip {
        root /var/www/intelli-ai-engine;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="intelli-ai-engine.zip"';
    }

    # Engine 插件 landing 页面（只暴露单个 HTML）
    location = /engine/landing.html {
        root /var/www/intelli-ai-engine/site;
        try_files /landing.html =404;
    }

    # Engine 插件 docs 页面（只暴露单个 HTML）
    location = /engine/docs.html {
        root /var/www/intelli-ai-engine/site;
        try_files /docs.html =404;
    }

    # Engine 插件文档静态资源（docs.html 需要访问 docs/ 下的 md 和 docs-list.json）
    location /engine/docs/ {
        alias /var/www/intelli-ai-engine/site/docs/;
        try_files $uri $uri/ =404;
    }

    location /engine/imgs/ {
        alias /var/www/intelli-ai-engine/site/docs/imgs/;
        try_files $uri $uri/ =404;
    }

    # Engine 插件静态资源（logo.svg, favicon.svg 等）
    location ~* ^/engine/(logo|favicon)\.svg$ {
        alias /var/www/intelli-ai-engine/site/$1.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    ############################################
    # 其他插件配置将在这里添加
    ############################################
    #
    # 添加新插件时，按照以下格式添加：
    #
    # ############################################
    # # Javadoc 插件配置 (intelli-ai-javadoc)
    # # 访问路径: /javadoc/
    # ############################################
    location = /javadoc/intelli-ai-javadoc.zip {
        root /var/www/intelli-ai-javadoc;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="intelli-ai-javadoc.zip"';
    }

    # Javadoc 插件 landing 页面（只暴露单个 HTML）
    location = /javadoc/landing.html {
        root /var/www/intelli-ai-javadoc/site;
        try_files /landing.html =404;
    }

    # Javadoc 插件 docs 页面（只暴露单个 HTML）
    location = /javadoc/docs.html {
        root /var/www/intelli-ai-javadoc/site;
        try_files /docs.html =404;
    }

    # Javadoc 插件文档静态资源（docs.html 需要访问 docs/ 下的 md 和 docs-list.json）
    location /javadoc/docs/ {
        alias /var/www/intelli-ai-javadoc/site/docs/;
        try_files $uri $uri/ =404;
    }

    location /javadoc/imgs/ {
        alias /var/www/intelli-ai-javadoc/site/docs/imgs/;
        try_files $uri $uri/ =404;
    }

    # Javadoc 插件静态资源（logo.svg, favicon.svg 等）
    location ~* ^/javadoc/(logo|favicon)\.svg$ {
        alias /var/www/intelli-ai-javadoc/site/$1.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    #
    # ############################################
    # # Changelog 插件配置 (intelli-ai-changelog)
    # # 访问路径: /changelog/
    # ############################################
    # location = /changelog/intelli-ai-changelog.zip { ... }
    # location /changelog/docs/ { ... }
    # location /changelog/ { ... }

    # 根路径重定向到 engine landing 页面（可选）
    location = / {
        return 301 /engine/landing.html;
    }
}

