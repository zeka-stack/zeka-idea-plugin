<?xml version="1.0" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg class="logo" viewBox="0 0 180 40" version="1.1" xmlns="http://www.w3.org/2000/svg" width="180" height="40">
    <defs>
        <!-- 暖色渐变：从橙红色到橙黄色 -->
        <linearGradient id="warmGradientLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1"/>
        </linearGradient>
        <!-- 冷色渐变：从深青色到浅青色，与暖色形成强烈对比 -->
        <linearGradient id="coolGradientLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1"/>
        </linearGradient>
        <!-- 圆点渐变：绿色径向渐变，与暖色形成强烈对比 -->
        <radialGradient id="dotGradientLogo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:1"/>
            <stop offset="70%" style="stop-color:#22C55E;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1"/>
        </radialGradient>
        <!-- 文字蓝色渐变：从深蓝色到浅蓝色 -->
        <linearGradient id="textGradientLogo" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1"/>
        </linearGradient>
    </defs>
    <!-- 图标部分（40x40） -->
    <g transform="translate(0, 0) scale(0.03125)">
        <!-- 六边形背景，使用冷色渐变填充中间留空区域 -->
        <path d="M548.235636 13.312l362.053819 209.035636a93.090909 93.090909 0 0 1 46.545454 80.616728v418.071272a93.090909 93.090909 0 0 1-46.545454 80.616728l-362.053819 209.035636a93.090909 93.090909 0 0 1-93.090909 0L93.090909 801.652364a93.090909 93.090909 0 0 1-46.545454-80.616728V302.964364a93.090909 93.090909 0 0 1 46.545454-80.616728L455.144727 13.312a93.090909 93.090909 0 0 1 93.090909 0z"
              fill="url(#coolGradientLogo)"/>
        <!-- 完整图标路径（六边形+字母），使用暖色渐变填充，fill-rule="evenodd" 让字母部分从六边形中挖空，露出冷色背景 -->
        <path d="M548.235636 13.312l362.053819 209.035636a93.090909 93.090909 0 0 1 46.545454 80.616728v418.071272a93.090909 93.090909 0 0 1-46.545454 80.616728l-362.053819 209.035636a93.090909 93.090909 0 0 1-93.090909 0L93.090909 801.652364a93.090909 93.090909 0 0 1-46.545454-80.616728V302.964364a93.090909 93.090909 0 0 1 46.545454-80.616728L455.144727 13.312a93.090909 93.090909 0 0 1 93.090909 0z m-142.894545 320.535273l-144.523636 375.226182h60.974545l35.188364-96.698182h161.349818l35.211636 96.698182h61.486546l-144.523637-375.226182h-65.163636z m-31.022546 231.237818l62.557091-169.751273h2.094546l62.021818 169.751273h-126.673455z m278.551273-231.237818v375.226182h56.762182V333.847273h-56.762182z"
              fill="url(#warmGradientLogo)" fill-rule="evenodd"/>
    </g>
    <!-- 右下角圆点，使用绿色径向渐变 -->
    <circle cx="33" cy="29" r="3.0" fill="url(#dotGradientLogo)" stroke="#FFFFFF" stroke-width="0.3"/>
    <!-- 文字部分：IntelliAI Engine，使用蓝色渐变 -->
    <text x="48" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700"
          fill="url(#textGradientLogo)">IntelliAI Engine
    </text>
</svg>

