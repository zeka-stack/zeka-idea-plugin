server {
    listen 80;
    server_name eng.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eng.dong4j.site;

    ssl_certificate /etc/nginx/encrypt/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/privkey.pem;

    root /var/www/eng-landing;
    index landing.html;

    location = / {
        try_files /landing.html =404;
    }

    location = /eng.zip {
        root /var/www/eng-landing;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="eng.zip"';
    }

    location /docs {
        alias /var/www/eng-docs/;
        index index.html;
        try_files $uri $uri/ /guide/index.html;
    }
}

