<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <defs>
        <!-- 主背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
        </linearGradient>

        <!-- 文字渐变 -->
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#ffd89b;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
        </linearGradient>

        <!-- 装饰性光效 -->
        <radialGradient id="glowGradient" cx="70%" cy="30%" r="50%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
        </radialGradient>
    </defs>

    <!-- 背景长方形 (32x26，更接近正方形，居中放置) -->
    <rect x="4" y="7" width="32" height="26" rx="4" ry="4" fill="url(#bgGradient)"/>

    <!-- 装饰性光效 -->
    <ellipse cx="26" cy="16" rx="12" ry="10" fill="url(#glowGradient)"/>

    <!-- 主文字 AI.J -->
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
          fill="url(#textGradient)" text-anchor="middle" dominant-baseline="middle">
        AI.J
    </text>

    <!-- 底部小字：Zeka -->
    <text x="20" y="29" font-family="Arial, sans-serif" font-size="4" font-weight="normal"
          fill="#ffffff" text-anchor="middle" opacity="0.75">
        Zeka.Stack
    </text>

    <!-- 装饰性闪光点 -->
    <circle cx="33" cy="29" r="0.8" fill="#ffffff" opacity="0.5">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="26" r="0.6" fill="#ffffff" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

</svg>
