# Advanced Configuration Hints
settings.max.retries.hint=Number of retries when request fails, higher values improve success rate but increase latency
settings.timeout.hint=Request timeout duration, too long will cause request failures
settings.temperature.hint=Controls randomness of generated results, lower values produce more deterministic results, range: [0.0-2.0]
settings.max.tokens.hint=Controls length of generated content, higher values increase cost
settings.top.p.hint=Controls diversity of generated results, lower values produce more focused results, range: [0.0-1.0]
settings.top.k.hint=Limited number of candidate tokens considered, lower values produce more deterministic results, range: [1-100]
settings.presence.penalty.hint=Controls repetition penalty \u2014 positive values reduce repetition, negative values increase it (range: -2.0 to 2.0)
settings.performance.mode.hint=Enable parallel processing across multiple AI providers for faster large-file handling

