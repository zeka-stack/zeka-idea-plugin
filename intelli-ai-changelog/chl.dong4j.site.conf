server {
    listen 80;
    server_name chl.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chl.dong4j.site;

    ssl_certificate /etc/nginx/encrypt/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/privkey.pem;

    root /var/www/chl-landing;
    index landing.html;

    location = / {
        try_files /landing.html =404;
    }

    location = /chl.zip {
        root /var/www/chl-landing;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="chl.zip"';
    }

    # 文档页面
    # 访问 /docs 或 /docs/ 时返回 docs.html
    location = /docs {
        root /var/www/chl-docs;
        try_files /docs.html =404;
    }
    
    location = /docs/ {
        root /var/www/chl-docs;
        try_files /docs.html =404;
    }
    
    # 文档资源目录（docs.html 中引用的 ./docs/ 路径）
    # 访问 /docs/docs/ 时指向实际的文档目录
    location /docs/docs/ {
        alias /var/www/chl-docs/docs/;
        # 设置 MIME 类型，确保 Markdown 和 JSON 文件可以正确访问
        default_type text/plain;
        # 允许跨域访问（如果需要）
        add_header Access-Control-Allow-Origin *;
    }
}

