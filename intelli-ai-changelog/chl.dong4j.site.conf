server {
    listen 80;
    server_name chl.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chl.dong4j.site;

    ssl_certificate /etc/nginx/encrypt/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/privkey.pem;

    root /var/www/chl-landing;
    index landing.html;

    location = / {
        try_files /landing.html =404;
    }

    location = /chl.zip {
        root /var/www/chl-landing;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="chl.zip"';
    }

    location /docs {
        alias /var/www/chl-docs/;
        index index.html;
        try_files $uri $uri/ /guide/index.html;
    }
}

