<?xml version="1.0" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg class="icon" viewBox="0 0 40 40" version="1.1" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
    <defs>
        <!-- 蓝色渐变 -->
        <linearGradient id="blueGradientFav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1"/>
        </linearGradient>
        <!-- 圆点渐变：绿色径向渐变 -->
        <radialGradient id="dotGradientFav" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:1"/>
            <stop offset="70%" style="stop-color:#22C55E;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1"/>
        </radialGradient>
    </defs>
    <!-- 透明背景，整体尺寸 40x40 -->
    <!-- 图标内容缩放并居中，四周留出透明边距 -->
    <g transform="translate(4, 4) scale(0.03125)">
        <!-- scale(0.03125) = 32/1024，将 1024x1024 的图标缩放到 32x32，四周各留 4px 透明边距 -->
        <!-- 蓝色渐变六边形背景 -->
        <path d="M548.235636 13.312l362.053819 209.035636a93.090909 93.090909 0 0 1 46.545454 80.616728v418.071272a93.090909 93.090909 0 0 1-46.545454 80.616728l-362.053819 209.035636a93.090909 93.090909 0 0 1-93.090909 0L93.090909 801.652364a93.090909 93.090909 0 0 1-46.545454-80.616728V302.964364a93.090909 93.090909 0 0 1 46.545454-80.616728L455.144727 13.312a93.090909 93.090909 0 0 1 93.090909 0z"
              fill="url(#blueGradientFav)"/>
        <!-- 蓝色渐变六边形 -->
        <path fill="url(#blueGradientFav)"
              d="M548.235636 13.312l362.053819 209.035636a93.090909 93.090909 0 0 1 46.545454 80.616728v418.071272a93.090909 93.090909 0 0 1-46.545454 80.616728l-362.053819 209.035636a93.090909 93.090909 0 0 1-93.090909 0L93.090909 801.652364a93.090909 93.090909 0 0 1-46.545454-80.616728V302.964364a93.090909 93.090909 0 0 1 46.545454-80.616728L455.144727 13.312a93.090909 93.090909 0 0 1 93.090909 0z"/>
        <!-- 白色 "T" 字母 -->
        <path fill="#FFFFFF" fill-rule="evenodd"
              d="M300 350 H724 V430 H300 Z
                 M472 430 H552 V774 H472 Z"/>
    </g>
    <!-- 右下角圆点，使用绿色径向渐变 -->
    <circle cx="33" cy="29" r="3.0" fill="url(#dotGradientFav)" stroke="#FFFFFF" stroke-width="0.3"/>
</svg>

